<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>SignalMap — Coverage Heatmap</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/h3-js@4.1.0/dist/h3-js.umd.js"></script>
    <style>
        html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
        #map { height: 100%; }
        #panel {
            position: absolute; top: 12px; right: 12px; z-index: 1000;
            background: #fff; padding: 12px 14px; border-radius: 8px;
            box-shadow: 0 1px 6px rgba(0,0,0,.3); font-size: 14px;
        }
        #panel label { font-weight: 600; }
        select { font-size: 14px; padding: 3px; }
        .legend { margin-top: 10px; font-size: 12px; }
        .bar {
            height: 10px; width: 160px; border-radius: 4px;
            background: linear-gradient(to right, hsl(0,80%,45%), hsl(60,80%,45%), hsl(120,80%,45%));
        }
        .legend-labels { display: flex; justify-content: space-between; width: 160px; }
        #count { margin-top: 8px; color: #555; font-size: 12px; }
    </style>
</head>
<body>
<div id="map"></div>
<div id="panel">
    <label for="operator">Operator:</label>
    <select id="operator">
        <option>Airtel</option>
        <option selected>Jio</option>
        <option>Vi</option>
        <option>BSNL</option>
    </select>
    <div class="legend">
        <div class="bar"></div>
        <div class="legend-labels"><span>0 (weak)</span><span>5 (strong)</span></div>
    </div>
    <div id="count"></div>
</div>

<script>
    const map = L.map('map').setView([13.0827, 80.2707], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19, attribution: '© OpenStreetMap'
    }).addTo(map);

    const layer = L.layerGroup().addTo(map);

    function colorFor(score) {
        const t = Math.max(0, Math.min(1, score / 5));
        return `hsl(${t * 120}, 80%, 45%)`;
    }

    async function loadHeatmap() {
        const b = map.getBounds();
        const operator = document.getElementById('operator').value;
        const params = new URLSearchParams({
            minLat: b.getSouth(), minLng: b.getWest(),
            maxLat: b.getNorth(), maxLng: b.getEast(),
            operator
        });

        let cells;
        try {
            const res = await fetch('/v1/heatmap?' + params);
            if (!res.ok) { document.getElementById('count').textContent =
                'Zoom in to load cells'; return; }
            cells = await res.json();
        } catch (e) {
            document.getElementById('count').textContent = 'API error'; return;
        }

        layer.clearLayers();
        for (const c of cells) {
            const boundary = h3.cellToBoundary(c.h3Index);
            L.polygon(boundary, {
                color: '#333', weight: 0.5,
                fillColor: colorFor(c.qualityScore),
                fillOpacity: 0.55
            }).bindPopup(
                `score: ${c.qualityScore.toFixed(2)}<br>` +
                `samples: ${c.sampleCount}<br>` +
                `confidence: ${c.confidence.toFixed(2)}`
            ).addTo(layer);
        }
        document.getElementById('count').textContent = cells.length + ' cells shown';
    }

    map.on('moveend', loadHeatmap);
    document.getElementById('operator').addEventListener('change', loadHeatmap);
    loadHeatmap();
</script>
</body>
</html>
