spring:
  application:
    name: signalmap
  datasource:
    # reWriteBatchedInserts pays off later when ingestion does batch inserts.
    url: jdbc:postgresql://localhost:5432/signalmap?reWriteBatchedInserts=true
    username: signalmap
    password: signalmap
  flyway:
    enabled: true
  data:
    redis:
      host: localhost
      port: 6379
    cache:
      type: redis


server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Application-specific tuning (grows as we add features).
signalmap:
  h3:
    resolution: 8   # ~0.7 km^2 cells
  aggregation:
    tau-seconds: 604800      # 7-day decay constant for time weighting
    window-days: 14          # only aggregate readings newer than this
    confidence-k: 10         # effective (weighted) samples for full confidence
    cron: "0 */5 * * * *"    # roll up every 5 minutes
  coverage:
    min-samples: 3



# ML prediction sidecar (Python FastAPI). If it's down, coverage queries
# degrade to the neighbour-average fallback rather than failing.
ml:
  base-url: http://localhost:8000
  timeout-ms: 400
  enabled: true

resilience4j:
  circuitbreaker:
    instances:
      mlPredict:
        sliding-window-size: 20
        failure-rate-threshold: 50        # >50% failures -> open the circuit
        wait-duration-in-open-state: 30s  # stop calling ML for 30s
        permitted-number-of-calls-in-half-open-state: 3